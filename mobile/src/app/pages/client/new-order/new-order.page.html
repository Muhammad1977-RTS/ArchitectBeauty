<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/client-orders"></ion-back-button>
    </ion-buttons>
    <ion-title>Новая заявка</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-item>
      <ion-label>Тип работы</ion-label>
      <ion-select formControlName="work_type_id" interface="action-sheet" placeholder="Выберите">
        <ion-select-option *ngFor="let wt of workTypes" [value]="wt.id">{{ wt.name }}</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Площадь (м²)</ion-label>
      <ion-input type="number" formControlName="area_sqm" min="1"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Адрес</ion-label>
      <ion-input type="text" formControlName="address"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Описание (необязательно)</ion-label>
      <ion-textarea formControlName="description" rows="3"></ion-textarea>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="loading" class="ion-margin-top">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      <span *ngIf="!loading">Создать заявку</span>
    </ion-button>
  </form>
</ion-content>
