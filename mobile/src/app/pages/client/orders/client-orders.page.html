<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Мои заявки</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="new">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <ion-list *ngIf="!loading">
    <ion-item *ngIf="orders.length === 0" class="ion-text-center">
      <ion-label color="medium">Заявок пока нет. Создайте первую!</ion-label>
    </ion-item>

    <ion-item *ngFor="let o of orders" [routerLink]="o.id" detail>
      <ion-label>
        <h2>{{ o.work_type?.name ?? 'Работа' }}</h2>
        <p>{{ o.address }} · {{ o.area_sqm }} м²</p>
      </ion-label>
      <ion-badge slot="end" [color]="statusColor(o.status)">{{ statusLabel(o.status) }}</ion-badge>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="new">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
