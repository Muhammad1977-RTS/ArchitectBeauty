<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Мои товары</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="showForm = !showForm">
        <ion-icon slot="icon-only" [name]="showForm ? 'close' : 'add'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Add product form -->
  <ion-card *ngIf="showForm">
    <ion-card-header><ion-card-title>Новый товар</ion-card-title></ion-card-header>
    <ion-card-content>
      <form [formGroup]="form" (ngSubmit)="addProduct()">
        <ion-item><ion-label position="floating">Название</ion-label><ion-input formControlName="name"></ion-input></ion-item>
        <ion-item><ion-label position="floating">Описание</ion-label><ion-textarea formControlName="description" rows="2"></ion-textarea></ion-item>
        <ion-item><ion-label position="floating">Цена (₸)</ion-label><ion-input type="number" formControlName="price"></ion-input></ion-item>
        <ion-item>
          <ion-label>Единица</ion-label>
          <ion-select formControlName="unit" interface="action-sheet">
            <ion-select-option *ngFor="let u of units" [value]="u">{{ u }}</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-item><ion-label position="floating">Категория</ion-label><ion-input formControlName="category"></ion-input></ion-item>
        <ion-item>
          <ion-label>В наличии</ion-label>
          <ion-toggle formControlName="in_stock" slot="end"></ion-toggle>
        </ion-item>
        <ion-button expand="block" type="submit" [disabled]="submitting" class="ion-margin-top">
          <ion-spinner *ngIf="submitting" name="crescent"></ion-spinner>
          <span *ngIf="!submitting">Добавить</span>
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <div *ngIf="loading" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <ion-list *ngIf="!loading">
    <ion-item *ngIf="products.length === 0">
      <ion-label color="medium">Товаров пока нет. Добавьте первый!</ion-label>
    </ion-item>
    <ion-item *ngFor="let p of products">
      <ion-label>
        <h2>{{ p.name }}</h2>
        <p>{{ p.price | number }} ₸ / {{ p.unit }}</p>
        <p *ngIf="p.category">{{ p.category }}</p>
      </ion-label>
      <ion-badge slot="end" [color]="p.in_stock ? 'success' : 'medium'">
        {{ p.in_stock ? 'В наличии' : 'Нет' }}
      </ion-badge>
      <ion-button slot="end" fill="clear" color="danger" (click)="deleteProduct(p.id)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
