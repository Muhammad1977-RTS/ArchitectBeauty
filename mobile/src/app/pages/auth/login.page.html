<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Мастеро</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="logo-area">
    <h1>Добро пожаловать</h1>
    <p>Войдите в свой аккаунт</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" formControlName="email" autocomplete="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Пароль</ion-label>
      <ion-input type="password" formControlName="password" autocomplete="current-password"></ion-input>
    </ion-item>

    <ion-text color="danger" *ngIf="error">
      <p class="ion-padding-start">{{ error }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" [disabled]="loading" class="ion-margin-top">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      <span *ngIf="!loading">Войти</span>
    </ion-button>
  </form>

  <ion-button fill="clear" expand="block" routerLink="/auth/register" class="ion-margin-top">
    Нет аккаунта? Зарегистрироваться
  </ion-button>
</ion-content>
