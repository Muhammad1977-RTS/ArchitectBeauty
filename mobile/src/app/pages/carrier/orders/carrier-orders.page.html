<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Грузы</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="loading" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <ion-list *ngIf="!loading">
    <ion-item *ngIf="orders.length === 0">
      <ion-label color="medium">Новых заявок нет</ion-label>
    </ion-item>
    <ion-item *ngFor="let o of orders" [routerLink]="o.id" detail>
      <ion-label>
        <h2>{{ o.from_address }} → {{ o.to_address }}</h2>
        <p>{{ o.cargo_description }}</p>
        <p *ngIf="o.cargo_weight_kg">{{ o.cargo_weight_kg }} кг</p>
        <p *ngIf="o.budget">Бюджет: {{ o.budget | number }} ₸</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
