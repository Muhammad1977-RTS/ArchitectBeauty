<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Мои отклики</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="loading" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <ion-list *ngIf="!loading">
    <ion-item *ngIf="responses.length === 0">
      <ion-label color="medium">Откликов пока нет</ion-label>
    </ion-item>
    <ion-item *ngFor="let r of responses" [routerLink]="['/tabs/master-orders', r.order_id]" detail>
      <ion-label>
        <h2>{{ r.order?.work_type?.name ?? 'Заказ' }}</h2>
        <p>{{ r.order?.address }}</p>
        <p>Ваша цена: {{ r.proposed_price | number }} ₸</p>
      </ion-label>
      <ion-badge slot="end" [color]="r.order?.status === 'master_selected' && r.order?.selected_master_id === r.master_id ? 'success' : 'medium'">
        {{ r.order?.status === 'master_selected' && r.order?.selected_master_id === r.master_id ? 'Выбран' : 'Ожидание' }}
      </ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
