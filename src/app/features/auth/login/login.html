<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="34" height="38" viewBox="0 0 34 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 30L2 15Q17 2 32 15L32 30" stroke="#1E3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="17" y1="9" x2="17" y2="18" stroke="#1E3A5F" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="17" cy="22" r="3.5" fill="#1E3A5F"/>
        <line x1="2" y1="35" x2="32" y2="35" stroke="#C86A3A" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h1 class="auth-title">Маст<span class="accent-e">е</span>ро</h1>
    </div>

    <h2 class="auth-heading">Войти</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      @if (error()) {
        <div class="form-error-box">{{ error() }}</div>
      }

      <div class="form-field">
        <label class="form-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="form-input"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
        @if (form.get('email')!.invalid && form.get('email')!.touched) {
          <span class="field-error">Введите корректный email</span>
        }
      </div>

      <div class="form-field">
        <label class="form-label" for="password">Пароль</label>
        <div class="password-wrap">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-input"
            formControlName="password"
            placeholder="Ваш пароль"
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Скрыть пароль' : 'Показать пароль'">
            @if (showPassword()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
        @if (form.get('password')!.invalid && form.get('password')!.touched) {
          <span class="field-error">Введите пароль</span>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) { Вход... } @else { Войти }
      </button>
    </form>

    <p class="auth-footer">
      Нет аккаунта?
      <a routerLink="/auth/register" class="auth-link">Зарегистрироваться</a>
    </p>
  </div>
</div>

<style>
.password-wrap { position: relative; }
.password-wrap .form-input { padding-right: 42px; }
.password-toggle {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; padding: 4px;
  color: var(--color-text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  transition: color .15s;
  &:hover { color: var(--color-text); }
}
</style>
