<nav class="navbar">
  <a routerLink="/" class="nav-brand">
    <span class="nav-brand-icon">🏗️</span>
    <span class="nav-brand-name">ArchitectBeauty</span>
  </a>

  @if (isAuthenticated()) {
    <div class="nav-links">
      @if (role() === 'client') {
        <a routerLink="/client/orders" routerLinkActive="nav-link--active" class="nav-link">Мои заявки</a>
      }
      @if (role() === 'master') {
        <a routerLink="/master/orders" routerLinkActive="nav-link--active" class="nav-link">Найти заказ</a>
        <a routerLink="/master/responses" routerLinkActive="nav-link--active" class="nav-link nav-link--with-badge">
          Мои отклики
          @if (chatService.unreadCount() > 0) {
            <span class="nav-badge">{{ chatService.unreadCount() > 9 ? '9+' : chatService.unreadCount() }}</span>
          }
        </a>
      }
    </div>
    <div class="nav-right">
      <a routerLink="/profile" routerLinkActive="nav-link--active" class="nav-link">Профиль</a>
      <button class="nav-logout" (click)="logout()">Выйти</button>
    </div>
  } @else {
    <div class="nav-right">
      <a routerLink="/auth/login" class="nav-link">Войти</a>
      <a routerLink="/auth/register" class="btn-primary btn-sm">Регистрация</a>
    </div>
  }
</nav>

<style>
.nav-link--with-badge { position: relative; }

.nav-badge {
  position: absolute;
  top: -6px;
  right: -10px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  background: #E53935;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  pointer-events: none;
}
</style>
